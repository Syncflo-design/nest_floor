[project]
name = "nest_floor"
authors = [{ name = "Syncflo", email = "ops@syncflo.co.za" }]
description = "Shop floor and site screens for a phone: scan, a number, one button. Receive, goods to site, used on site, find stock, labels."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "nest_floor"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"
